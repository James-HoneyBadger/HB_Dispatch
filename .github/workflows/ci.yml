name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q hb_engine tests scripts dispatch.py desktop.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  encryption:
    name: encryption (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install SQLCipher
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libsqlcipher-dev pkg-config
          else
            brew install sqlcipher pkg-config
          fi
      - name: Install the Python binding
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install sqlcipher3
          else
            export PKG_CONFIG_PATH="$(brew --prefix sqlcipher)/lib/pkgconfig"
            python -m pip install sqlcipher3
          fi
      - name: Prove encryption is active
        run: python -c "import sqlcipher3; print('sqlcipher', sqlcipher3.sqlite_version)"
      - name: Tests with encryption enabled
        run: python -m unittest discover -s tests -v
      - name: Security review vectors
        run: ./scripts/security_review_vectors.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Documentation fidelity
        run: python3 scripts/check_doc_fidelity.py

  scheduler:
    name: scheduler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install, inspect and remove a real scheduler entry
        run: python scripts/scheduler_smoke.py

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build and smoke-test the bundled engine
        run: python scripts/build_engine.py --no-copy --smoke

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install mypy==2.4.1
      - name: Type check
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check frontend
        run: npm run build
