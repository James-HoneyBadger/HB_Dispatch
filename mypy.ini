[mypy]
python_version = 3.12
files = hb_engine, scripts/check_doc_fidelity.py, tests/test_doc_fidelity.py, tests/test_compatibility_shims.py

; The codebase is intentionally unannotated, so check_untyped_defs stays off:
; enabling it reports 21 inference artefacts (tuple reassignment, tkinter
; widget unions) rather than defects. Turn it on once annotations exist.
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

; Optional third-party backends imported lazily at runtime. They are not
; required for the core archive and are not installed in the typecheck job.
[mypy-sqlcipher3.*]
ignore_missing_imports = True

[mypy-sqlcipher3]
ignore_missing_imports = True

[mypy-keyring.*]
ignore_missing_imports = True

[mypy-keyring]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-cryptography]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True
